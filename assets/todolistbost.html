
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .side-image {
            width: 100%;
            height: 100%;
            min-height: 450px;
            object-fit: cover;
        }

        .task-input {
            max-width: 750px;
            margin: 0 auto 30px;
        }

        .task-input input {
            min-width: 180px;
        }

        @media (max-width: 767px) {
            .side-image {
                height: 220px;
                min-height: 220px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">To Do App</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#tasks">Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#footer">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid my-4 px-4">
        <div class="row g-4">

            <!-- Left Side Image -->
            <div class="col-md-3">
                <img
                    src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&w=700&q=80"
                    alt="Planning and notebook"
                    class="side-image rounded shadow">
            </div>

            <!-- Right Side To Do App -->
            <div class="col-md-9" id="tasks">
                <div class="card shadow h-100">

                    <div class="card-body p-3 p-md-4">

                        <h2 class="text-center mb-4">To Do App</h2>

                        <!-- Input and Buttons -->
                        <div class="task-input d-flex flex-wrap justify-content-center gap-3">
                            <input
                                type="text"
                                id="taskInput"
                                class="form-control w-auto"
                                placeholder="Enter a task here">

                            <button class="btn btn-primary" onclick="saveTask()">
                                SAVE
                            </button>

                            <button class="btn btn-warning" onclick="getTasks()">
                                GET TASKS
                            </button>
                        </div>

                        <!-- Task Table -->
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>No.</th>
                                        <th>Todo item</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>

                                <tbody id="taskList">
                                    <tr>
                                        <td>1</td>
                                        <td>Buy groceries for next week</td>
                                        <td>In progress</td>
                                        <td>
                                            <button class="btn btn-danger btn-sm mb-1"
                                                onclick="deleteTask(this)">DELETE</button>

                                            <button class="btn btn-success btn-sm mb-1"
                                                onclick="finishTask(this)">FINISHED</button>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>2</td>
                                        <td>Renew car insurance</td>
                                        <td>In progress</td>
                                        <td>
                                            <button class="btn btn-danger btn-sm mb-1"
                                                onclick="deleteTask(this)">DELETE</button>

                                            <button class="btn btn-success btn-sm mb-1"
                                                onclick="finishTask(this)">FINISHED</button>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>3</td>
                                        <td>Sign up for online course</td>
                                        <td>In progress</td>
                                        <td>
                                            <button class="btn btn-danger btn-sm mb-1"
                                                onclick="deleteTask(this)">DELETE</button>

                                            <button class="btn btn-success btn-sm mb-1"
                                                onclick="finishTask(this)">FINISHED</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer id="footer" class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; 2026 To Do App | Organize your tasks, manage your time.
        </p>
    </footer>

    <!-- JavaScript -->
    <script>
        function saveTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let table = document.getElementById("taskList");
            let row = table.insertRow();

            let taskCell = row.insertCell(0);
            let nameCell = row.insertCell(1);
            let statusCell = row.insertCell(2);
            let actionsCell = row.insertCell(3);

            taskCell.textContent = "";
            nameCell.textContent = task;
            statusCell.textContent = "In progress";

            actionsCell.innerHTML = `
                <button class="btn btn-danger btn-sm mb-1"
                    onclick="deleteTask(this)">DELETE</button>

                <button class="btn btn-success btn-sm mb-1"
                    onclick="finishTask(this)">FINISHED</button>
            `;

            input.value = "";
            updateNumbers();
        }

        function deleteTask(button) {
            button.closest("tr").remove();
            updateNumbers();
        }

        function finishTask(button) {
            let row = button.closest("tr");

            row.cells[2].textContent = "Finished";
            row.cells[1].classList.add("text-decoration-line-through", "text-secondary");

            button.disabled = true;
        }

        function getTasks() {
            alert("Your tasks are displayed in the table.");
        }

        function updateNumbers() {
            let rows = document.querySelectorAll("#taskList tr");

            rows.forEach(function(row, index) {
                row.cells[0].textContent = index + 1;
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
