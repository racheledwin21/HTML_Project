<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Layout Designs</title>

        body {
            margin: 0;
            background-color: olive;
        }

        h2 {
            text-align: center;
            padding: 15px;
            margin: 0;
            color: black;
        }

        .container {
            background-color: #b07e7e;
            margin: 10px 20px;
            padding: 16px;
            min-height: 500px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 0;
        }

        .container img {
            width: 31%;
            height: 194px;
            object-fit: cover;
        }

        .container img:nth-child(4) {
            margin-left: 35%;
        }

        @media (max-width: 600px) {
            .container img {
                width: 100%;
                height: 180px;
            }

            .container img:nth-child(4) {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
